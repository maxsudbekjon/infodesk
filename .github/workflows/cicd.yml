name: CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare env
        run: cp env.example .env

      - name: Django deploy checks
        run: python manage.py check --deploy
        env:
          DJANGO_ENV: prod
          SECRET_KEY: ci-secret-key
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          CSRF_TRUSTED_ORIGINS: http://localhost:8000

      - name: Run migrations
        run: python manage.py migrate --noinput
        env:
          DJANGO_ENV: dev
          DB_TYPE: SQLITE
          DB_NAME: db.sqlite3

      - name: Run tests
        run: python manage.py test
        env:
          DJANGO_ENV: dev
          DB_TYPE: SQLITE
          DB_NAME: db.sqlite3

  deploy:
    name: Deploy to dev
    needs: test
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: self-hosted
    timeout-minutes: 15
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false

    steps:
      - name: Pull latest code
        working-directory: /home/ubuntu/projects/backends/infodesk
        run: |
          git fetch origin
          git checkout dev
          git pull origin dev

      - name: Stop existing containers
        working-directory: /home/ubuntu/projects/backends/infodesk
        run: docker compose -f docker-compose.yaml down --remove-orphans

      - name: Build and deploy
        working-directory: /home/ubuntu/projects/backends/infodesk
        run: docker compose -f docker-compose.yaml up -d --build

      - name: Health check
        working-directory: /home/ubuntu/projects/backends/infodesk
        run: |
          echo "Waiting for backend to become healthy..."
          for i in $(seq 1 10); do
            if docker compose -f docker-compose.yaml ps web | grep -q "(healthy)"; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "  Attempt $i/10 — waiting 5s..."
            sleep 5
          done
          echo "Health check failed after 50s"
          docker compose -f docker-compose.yaml logs web --tail=50
          exit 1
