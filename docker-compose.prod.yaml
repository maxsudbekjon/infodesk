version: "3.9"

services:
  web:
    build: .
    env_file:
      - .env
    environment:
      DJANGO_ENV: prod
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    depends_on:
      - redis

  redis:
    image: redis:7
    restart: unless-stopped

  celery_worker:
    build: .
    env_file:
      - .env
    environment:
      DJANGO_ENV: prod
    command: celery -A config worker -l info
    depends_on:
      - redis

  celery_beat:
    build: .
    env_file:
      - .env
    environment:
      DJANGO_ENV: prod
    command: celery -A config beat -l info
    depends_on:
      - redis
